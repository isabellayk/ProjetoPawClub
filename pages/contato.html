<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawClub</title>
    <!-- link bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--  -->
    <link rel="stylesheet" href="../src/css/estiloContato.css">
</head>
<body>
  
<header>
 <h1> <a href="../index.html">PawClub</a> </h1>
  <nav class="menu">
    <ul>
      <li><a href="./portifolio.html">Portifólio</a></li>
      <li><a href="./sobre.html">Sobre</a></li>
      <li><a href="./contato.html">Contato</a></li>
    </ul>
  </nav>
</header>

<main>
  
  <section class="contato">

    <div class="container-fluid">

      <div class="row align-items-center">

        <!-- espaço -->
        <div class="col-1"></div>

        <!-- gato -->
        <div class="col-2 text-center">
          <img src="../src/assets/IMG_gatoContato.png" alt="Gato" class="img-fluid">
        </div>

        <!-- formulário -->
        <div class="col-6">

          <div class="formulario">

            <h1>Fale Conosco</h1>

            <form>

              <input type="text" placeholder="Nome" id="nome">

              <input type="email" placeholder="Email" id="email">

              <textarea placeholder="Mensagem" id="mensagem"></textarea>

              <button type="submit" id="botao">Enviar</button>

            </form>

          </div>

        </div>

        <!-- cachorro -->
        <div class="col-2 text-center">
          <img src="../src/assets/IMG_cachorroContato.png" alt="Cachorro" class="img-fluid">
        </div>

        <!-- espaço -->
        <div class="col-1"></div>

      </div>

    </div>

  </section>

</main>
  
</body>
  
</html>
