<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawClub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../src/css/estiloContato.css">
    <link rel="stylesheet" href="./src/css/estilo.css">
</head>
<body>
  
<header>
    <div class="header-container">
        <h1><a href="../index.html">PawClub</a></h1>
        <nav class="menu">
            <ul>
                <li><a href="./portifolio.html">Portifólio</a></li>
                <li><a href="./sobre.html">Sobre</a></li>
                <li><a href="./contato.html" class="active">Contato</a></li>
            </ul>
        </nav>
    </div>
</header>

<main>
    <section class="contato">
        <div id="gato">
            <img src="../src/assets/IMG_gatoContato.png" alt="Gato" class="img-fluid">
        </div>
        
        <div id="cachorro">
            <img src="../src/assets/IMG_cachorroContato.png" alt="Cachorro" class="img-fluid">
        </div>

        <div class="formulario-wrapper">
            <div class="formulario">
                <h1>Fale Conosco</h1>
                <form>
                    <input type="text" placeholder="Nome:" id="nome" required>
                    <input type="email" placeholder="Email:" id="email" required>
                    <textarea placeholder="Mensagem:" id="mensagem" required></textarea>
                    <button type="submit" id="botao">Enviar</button>
                </form>
            </div>
        </div>
    </section>
</main>

<footer>
    <div class="footer-container">
        <div class="footer-logo">
            <div id="patinha">
                <img src="../src/assets/Logo .png" alt="Patinha PawClub">
            </div>
        </div>

        <div class="linha"></div>

        <div class="footer-contato">
            <p>pawclub@gmail.com</p>
            <p>11 98000-9123</p>
            <div class="redes">
                <a href="#"><i class="bi bi-instagram"></i></a>
                <a href="#"><i class="bi bi-twitter-x"></i></a>
            </div>
        </div>
    </div>

    <p class="copy">
        © 2026 Projeto PawClub. Todos os direitos reservados.
    </p>
</footer>
  
</body>
</html>
